name: Build and Release CaptureX APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        working-directory: ./capturex_mobile
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./capturex_mobile
        run: flutter build apk --release --split-per-abi=false

      - name: Rename APK Output
        run: |
          mkdir -p release-output
          cp capturex_mobile/build/app/outputs/flutter-apk/app-release.apk release-output/CaptureX-v1.0.0-Release.apk
          ls -la release-output

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CaptureX-v1.0.0-Release-APK
          path: release-output/CaptureX-v1.0.0-Release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          name: CaptureX Release v1.0.0
          tag_name: v1.0.0
          draft: false
          prerelease: false
          body: |
            ## 📸 CaptureX — Pro Classic Camera Lenses (v1.0.0)

            ### ✨ Key Features
            - **Classic Camera Lenses**: Noctilux 50mm ƒ/0.95, Helios 44-2 58mm, Summicron 35mm, Biotar 75mm, Anamorphic 1.33x, Macro 100mm.
            - **Interactive Bokeh & Depth**: Realistic depth of field simulation with aperture control (ƒ/0.95 to ƒ/16).
            - **Studio Color Lab**: Moody Noir, Dreamy Glow, Nightcore Neon, Vivid Pop, Portra 400, Tri-X B&W.
            - **Automatic Watermark**: Official "Shot with CaptureX" watermark badge with EXIF metadata.
            - **Acoustic Feedback**: Mechanical shutter blade sound & tactile haptics.

            ### 📦 Direct APK Download
            Download `CaptureX-v1.0.0-Release.apk` below and install on Android.
          files: release-output/CaptureX-v1.0.0-Release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
