name: Build and Release CaptureX APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Verify Environment
        run: |
          flutter doctor -v
          java -version

      - name: Install Dependencies
        working-directory: ./capturex_mobile
        run: flutter pub get

      - name: Generate App Icon
        working-directory: ./capturex_mobile
        run: dart run flutter_launcher_icons

      - name: Build Android Universal Release APK
        working-directory: ./capturex_mobile
        run: flutter build apk --release --no-tree-shake-icons

      - name: Prepare Output Directory
        run: |
          mkdir -p release-output
          cp capturex_mobile/build/app/outputs/flutter-apk/app-release.apk release-output/CaptureX-v1.2.0-Release.apk
          ls -la release-output/

      - name: Upload APK Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: CaptureX-v1.2.0-Release-APK
          path: release-output/CaptureX-v1.2.0-Release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.2.0
          name: "CaptureX v1.2.0 — Filters on Dock + All Effects + Save Fixed"
          draft: false
          prerelease: false
          body: |
            ## 📸 CaptureX v1.2.0

            ### 🆕 What's New
            - **Filters on camera dock** — 10 filter presets (Original, Moody, Dreamy, Nightcore, Vivid, Portra, B&W, Cinematic, Vintage, Velvia) shown as a live strip at the bottom of the camera screen. Tap any filter to see it applied instantly on the live preview.
            - **Real-time ColorFilter engine** — All filter effects (including user adjustments) are applied via GPU-accelerated `ColorFilter.matrix` directly on the camera preview.
            - **8 adjustment sliders** — Brightness, Contrast, Saturation, Temperature, Tint, Vignette, Grain, Exposure. Tap the tune icon to expand the controls panel.
            - **Vignette + Grain overlays** — Rendered on top of the camera preview.
            - **Save to Gallery FIXED** — Uses the `gal` package to reliably save photos to your device gallery in a "CaptureX" album.
            - **About page** — OctaDevs credited as Lead Developers. © 2026.
            - **Liquid glass UI** — Frosted backdrop filter on top bar, bottom panel, preview sheet, and watermark badge.
            - **Shutter centered** — Flip camera ← ⬤ → Gallery row at the center bottom.

            ### 📦 Install
            Download `CaptureX-v1.2.0-Release.apk` below.
            Enable "Install unknown apps" for your file manager, then install.
          files: release-output/CaptureX-v1.2.0-Release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
