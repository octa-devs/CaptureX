name: Build and Release CaptureX APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Verify Environment
        run: |
          flutter doctor -v
          java -version

      - name: Install Dependencies
        working-directory: ./capturex_mobile
        run: flutter pub get

      - name: Generate App Icon
        working-directory: ./capturex_mobile
        run: dart run flutter_launcher_icons

      - name: Build Android Universal Release APK
        working-directory: ./capturex_mobile
        run: flutter build apk --release --no-tree-shake-icons

      - name: Prepare Output Directory
        run: |
          mkdir -p release-output
          cp capturex_mobile/build/app/outputs/flutter-apk/app-release.apk release-output/CaptureX-v1.1.0-Release.apk
          ls -la release-output/

      - name: Upload APK Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: CaptureX-v1.1.0-Release-APK
          path: release-output/CaptureX-v1.1.0-Release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.1.0
          name: "CaptureX v1.1.0 — Real Camera + Video + Liquid Glass"
          draft: false
          prerelease: false
          body: |
            ## 📸 CaptureX v1.1.0 — Pro Camera & Video App

            ### ✨ What's New
            - **Real live camera preview** — full camera with tap-to-focus, pinch-to-zoom
            - **Video recording** — HD video with real-time timer, red recording indicator
            - **Liquid Glass UI** — frosted BackdropFilter panels throughout the app
            - **Centered shutter button** — like a real camera app: flip | shutter | gallery
            - **Mode selector** — PHOTO | VIDEO | PORTRAIT | SLOW-MO
            - **Flash toggle** — Off / Auto / On / Torch
            - **Filter Studio** — 10 presets + manual exposure, saturation, temperature, vignette, grain sliders
            - **About page** — CaptureX logo, version, feature cards, tech stack
            - **Splash screen** — animated logo reveal on launch
            - **Auto watermark** — "Shot with CaptureX" glass badge on every photo
            - **App icon** — CaptureX logo as the launcher icon

            ### 📦 Install
            Download `CaptureX-v1.1.0-Release.apk` below.
            Allow installation from unknown sources, then install.
          files: release-output/CaptureX-v1.1.0-Release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
